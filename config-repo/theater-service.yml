server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3309/theater_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
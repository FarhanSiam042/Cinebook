spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3312/notification_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
management:
  endpoints:
    web:
      exposure:
        include: health,info
eureka:
  instance:
    prefer-ip-address: true
server:
  port: 8086
